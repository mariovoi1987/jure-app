<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUREMA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f4f6;
 color:#222;
}
header{
 background:#111827;
 color:white;
 padding:16px;
 text-align:center;
 font-size:22px;
 font-weight:bold;
}
.screen{display:none;padding:15px;padding-bottom:90px}
.screen.active{display:block}
h2{margin-top:5px}
button{
 border:0;
 border-radius:10px;
 padding:12px 15px;
 margin:5px 2px;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
}
.btn{background:#111827;color:white}
.green{background:#16803c;color:white}
.red{background:#c62828;color:white}
.gray{background:#6b7280;color:white}
.blue{background:#2563eb;color:white}
.card{
 background:white;
 border-radius:14px;
 padding:15px;
 margin:10px 0;
 box-shadow:0 2px 8px #0001;
}
.menu{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin-top:20px;
}
.menu button{
 min-height:85px;
 font-size:16px;
}
input,select,textarea{
 width:100%;
 padding:12px;
 margin:5px 0 12px;
 border:1px solid #ccc;
 border-radius:9px;
 font-size:16px;
 background:white;
}
textarea{min-height:90px}
label{
 display:block;
 font-weight:bold;
 margin-top:8px;
}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}
.item{
 border:1px solid #ddd;
 border-radius:10px;
 padding:10px;
 margin:8px 0;
}
.total{
 font-size:20px;
 font-weight:bold;
 text-align:right;
 margin:10px 0;
}
.status{
 display:inline-block;
 padding:5px 9px;
 border-radius:15px;
 font-size:13px;
 font-weight:bold;
}
.paid{background:#d1fae5;color:#065f46}
.pending{background:#fee2e2;color:#991b1b}
.topbar{
 display:flex;
 align-items:center;
 gap:8px;
 margin-bottom:12px;
}
.topbar button{
 margin:0;
}
.photo{
 width:90px;
 height:90px;
 object-fit:cover;
 border-radius:8px;
 margin:4px;
}
.receipt{
 background:white;
 max-width:700px;
 margin:auto;
 padding:25px;
 color:#111;
}
.receipt h1{text-align:center}
.receipt-line{
 display:flex;
 justify-content:space-between;
 padding:6px 0;
 border-bottom:1px dashed #bbb;
}
@media print{
 body *{visibility:hidden!important}
 #receiptScreen,#receiptScreen *{
   visibility:visible!important;
 }
 #receiptScreen{
   display:block!important;
   position:absolute!important;
   left:0!important;
   top:0!important;
   width:100%!important;
   padding:0!important;
   background:white!important;
 }
 .no-print{display:none!important}
 .receipt{
   box-shadow:none!important;
   max-width:none!important;
   width:100%!important;
 }
}
</style>
</head>

<body>

<header>JUREMA</header>

<!-- INICIO -->
<section id="home" class="screen active">
 <h2>Panel principal</h2>

 <div class="menu">
  <button class="btn" onclick="openScreen('service')">🛠️<br>Servicio Técnico</button>
  <button class="btn" onclick="openScreen('mdf')">🪵<br>Pedido MDF</button>
  <button class="blue" onclick="openScreen('clients')">👥<br>Clientes</button>
  <button class="btn" onclick="openScreen('orders')">📋<br>Órdenes</button>
  <button class="btn" onclick="openScreen('equipment')">🖨️<br>Equipos</button>
  <button class="green" onclick="openScreen('cash')">💰<br>Caja JUREMA</button>
  <button class="gray" onclick="openScreen('backup')">💾<br>Copia de Seguridad</button>
 </div>
</section>

<!-- CLIENTES -->
<section id="clients" class="screen">
 <div class="topbar">
  <button class="gray" onclick="goBack()">←</button>
  <h2>Clientes</h2>
 </div>

 <input id="clientSearch" placeholder="Buscar cliente..." oninput="renderClients()">

 <button class="green" onclick="newClient()">➕ Nuevo cliente</button>

 <div id="clientsList"></div>
</section>

<!-- FORMULARIO CLIENTE -->
<section id="clientForm" class="screen">
 <div class="topbar">
  <button class="gray" onclick="goBack()">←</button>
  <h2 id="clientFormTitle">Nuevo cliente</h2>
 </div>

 <input type="hidden" id="clientId">

 <label>Nombre / Razón social</label>
 <input id="cName" placeholder="Nombre del cliente">

 <label>Teléfono</label>
 <div class="row">
  <input id="cPhone" placeholder="Teléfono">
  <button class="blue" type="button" onclick="importContact()">📱 Importar contacto</button>
 </div>

 <label>Dirección</label>
 <input id="cAddress" placeholder="Dirección">

 <label>Observaciones</label>
 <textarea id="cNotes"></textarea>

 <button class="green" onclick="saveClient()">💾 Guardar cliente</button>
 <button class="red" id="deleteClientBtn" onclick="deleteClient()" style="display:none">🗑️ Eliminar cliente</button>
</section>

<!-- SERVICIO -->
<section id="service" class="screen">
 <div class="topbar">
  <button class="gray" onclick="goBack()">←</button>
  <h2 id="serviceTitle">Servicio Técnico</h2>
 </div>

 <input type="hidden" id="sOrderId">

 <label>Cliente</label>
 <select id="sClient" onchange="updateContactFields('s')"></select>
 <button class="blue" onclick="newClientFromService()">➕ Nuevo cliente</button>

 <label>Teléfono</label>
 <input id="sPhone">

 <label>Dirección</label>
 <input id="sAddress">

 <label>Marca</label>
 <input id="sBrand" placeholder="Ej: HP">

 <label>Modelo</label>
 <input id="sModel" placeholder="Ej: LaserJet">

 <label>Número de serie</label>
 <input id="sSerial">

 <label>Problema informado</label>
 <textarea id="sProblem"></textarea>

 <label>Estado exterior</label>
 <textarea id="sCondition"></textarea>

 <label>Accesorios</label>
 <textarea id="sAccessories"></textarea>

 <label>Fotos</label>
 <input id="sPhotos" type="file" accept="image/*" multiple onchange="readPhotos()">
 <div id="photosPreview"></div>

 <label>Estado</label>
 <select id="sStatus">
  <option value="Pendiente">Pendiente</option>
  <option value="En reparación">En reparación</option>
  <option value="Listo">Listo</option>
  <option value="Entregado">Entregado</option>
 </select>

 <div class="row">
  <div>
   <label>Costo total</label>
   <input id="sCost" type="number" inputmode="decimal" oninput="calcService()">
  </div>
  <div>
   <label>Seña / cobrado</label>
   <input id="sPaid" type="number" inputmode="decimal" oninput="calcService()">
  </div>
 </div>

 <div class="total">Saldo: $<span id="sBalance">0</span></div>

 <label>Observaciones</label>
 <textarea id="sNotes"></textarea>

 <button class="green" onclick="saveService()">💾 Guardar servicio</button>
</section>

<!-- MDF -->
<section id="mdf" class="screen">
 <div class="topbar">
  <button class="gray" onclick="goBack()">←</button>
  <h2 id="mdfTitle">Pedido MDF</h2>
 </div>

 <input type="hidden" id="mOrderId">

 <label>Cliente</label>
 <select id="mClient" onchange="updateContactFields('m')"></select>
 <button class="blue" onclick="newClientFromMdf()">➕ Nuevo cliente</button>

 <label>Teléfono</label>
 <input id="mPhone">

 <label>Dirección</label>
 <input id="mAddress">

 <h3>Productos</h3>
 <div id="mdfItems"></div>

 <button class="blue" onclick="addMdfItem()">➕ Agregar producto</button>

 <div class="total">
  Total: $<span id="mTotal">0</span>
 </div>

 <label>Forma de pago</label>
 <select id="mPayment" onchange="calcMdf()">
  <option value="pending">Pendiente</option>
  <option value="paid">Pagado</option>
 </select>

 <div class="row">
  <div>
   <label>Seña / cobrado</label>
   <input id="mPaid" type="number" inputmode="decimal" oninput="calcMdf()">
  </div>
  <div>
   <label>Saldo</label>
   <input id="mBalance" readonly>
  </div>
 </div>

 <label>Observaciones</label>
 <textarea id="mNotes"></textarea>

 <button class="green" onclick="saveMdf()">💾 Guardar pedido</button>
</section>

<!-- ORDENES -->
<section id="orders" class="screen">
 <div class="topbar">
  <button class="gray" onclick="goBack()">←</button>
  <h2>Órdenes</h2>
 </div>

 <input id="orderSearch" placeholder="Buscar orden, cliente, equipo..." oninput="renderOrders()">

 <div>
  <button onclick="setOrderFilter('Todas')">Todas</button>
  <button onclick="setOrderFilter('Pendientes')">Pendientes</button>
  <button onclick="setOrderFilter('Terminadas')">Terminadas</button>
  <button onclick="setOrderFilter('Entregadas')">Entregadas</button>
 </div>

 <div id="ordersList"></div>
</section>

<!-- EQUIPOS -->
<section id="equipment" class="screen">
 <div class="topbar">
  <button class="gray" onclick="goBack()">←</button>
  <h2>Equipos / Impresoras</h2>
 </div>

 <input id="equipmentSearch" placeholder="Buscar equipo..." oninput="renderEquipment()">

 <div id="equipmentList"></div>
</section>

<!-- CAJA -->
<section id="cash" class="screen">
 <div class="topbar">
  <button class="gray" onclick="goBack()">←</button>
  <h2>Caja JUREMA</h2>
 </div>

 <div id="cashContent"></div>
</section>

<!-- BACKUP -->
<section id="backup" class="screen">
 <div class="topbar">
  <button class="gray" onclick="goBack()">←</button>
  <h2>Copia de Seguridad</h2>
 </div>

 <div class="card">
  <p>Guardá una copia de todos tus clientes y órdenes.</p>
  <button class="green" onclick="exportBackup()">⬇️ Exportar copia</button>
  <br>
  <label>Importar copia</label>
  <input type="file" id="backupFile" accept=".json" onchange="importBackup(event)">
 </div>

 <div id="backupInfo"></div>

 <div class="card">
  <button class="red" onclick="clearDatabase()">⚠️ Borrar todos los datos</button>
 </div>
</section>

<!-- RECIBO -->
<section id="receiptScreen" class="screen">
 <div class="topbar no-print">
  <button class="gray" onclick="goBack()">←</button>
  <h2>Documento</h2>
 </div>

 <div id="receiptContent" class="receipt"></div>

 <div class="no-print" style="text-align:center;margin-top:15px">
  <button class="green" onclick="printReceipt()">🖨️ Generar documento</button>
  <button class="blue" onclick="shareReceipt()">📤 Compartir</button>
 </div>
</section>

<script>
(function(){

"use strict";

var KEY="jurema_v5";

var db={
 clients:[],
 orders:[],
 next:5
};

var currentScreen="home";
var historyStack=[];
var orderFilter="Todas";
var afterClientTarget="";
var currentPhotos=[];

function $(id){
 return document.getElementById(id);
}

function uid(){
 return "id_"+Date.now()+"_"+Math.floor(Math.random()*1000000);
}

function money(n){
 n=Number(n)||0;
 return n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function esc(s){
 return String(s==null?"":s)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function today(){
 return new Date().toLocaleDateString("es-AR");
}

function loadDatabase(){
 try{
  var saved=localStorage.getItem(KEY);
  if(saved){
   var data=JSON.parse(saved);
   if(data && typeof data==="object"){
    db=data;
    if(!Array.isArray(db.clients)) db.clients=[];
    if(!Array.isArray(db.orders)) db.orders=[];
    if(!db.next) db.next=5;
   }
  }
 }catch(e){
  console.log(e);
 }
}

function persist(){
 localStorage.setItem(KEY,JSON.stringify(db));
 renderClients();
 renderOrders();
 renderEquipment();
 renderCash();
 renderBackupInfo();
}

function nextNumber(){
 var n=Number(db.next)||5;
 db.next=n+5;
 return String(n).padStart(5,"0");
}

function findClient(id){
 for(var i=0;i<db.clients.length;i++){
  if(db.clients[i].id===id)return db.clients[i];
 }
 return null;
}

function findOrder(id){
 for(var i=0;i<db.orders.length;i++){
  if(db.orders[i].id===id)return db.orders[i];
 }
 return null;
}

function clientName(id){
 var c=findClient(id);
 return c?c.name:"Cliente eliminado";
}

function openScreen(name,push){
 if(name===currentScreen)return;

 if(push!==false){
  historyStack.push(currentScreen);
 }

 var screens=document.querySelectorAll(".screen");
 for(var i=0;i<screens.length;i++){
  screens[i].classList.remove("active");
 }

 var target=$(name);
 if(target){
  target.classList.add("active");
  currentScreen=name;
 }

 if(name==="clients")renderClients();
 if(name==="orders")renderOrders();
 if(name==="equipment")renderEquipment();
 if(name==="cash")renderCash();
 if(name==="backup")renderBackupInfo();
}

function goBack(){
 if(historyStack.length){
  var previous=historyStack.pop();
  openScreen(previous,false);
 }else{
  openScreen("home",false);
 }
}

window.openScreen=openScreen;
window.goBack=goBack;

/* CLIENTES */

function fillClientSelect(id){
 var select=$(id);
 if(!select)return;

 var old=select.value;

 select.innerHTML='<option value="">-- Seleccionar cliente --</option>';

 for(var i=0;i<db.clients.length;i++){
  var c=db.clients[i];
  var op=document.createElement("option");
  op.value=c.id;
  op.textContent=c.name+(c.phone?" - "+c.phone:"");
  select.appendChild(op);
 }

 if(old && findClient(old))select.value=old;
}

function setupSelects(){
 fillClientSelect("sClient");
 fillClientSelect("mClient");
}

function updateContactFields(prefix){
 var id=$(prefix+"Client").value;
 var c=findClient(id);

 if(!c)return;

 $(prefix+"Phone").value=c.phone||"";
 $(prefix+"Address").value=c.address||"";
}

function newClient(){
 $("clientFormTitle").textContent="Nuevo cliente";
 $("clientId").value="";
 $("cName").value="";
 $("cPhone").value="";
 $("cAddress").value="";
 $("cNotes").value="";
 $("deleteClientBtn").style.display="none";

 openScreen("clientForm");
}

function editClient(id){
 var c=findClient(id);
 if(!c)return;

 $("clientFormTitle").textContent="Editar cliente";
 $("clientId").value=c.id;
 $("cName").value=c.name||"";
 $("cPhone").value=c.phone||"";
 $("cAddress").value=c.address||"";
 $("cNotes").value=c.notes||"";
 $("deleteClientBtn").style.display="block";

 openScreen("clientForm");
}

function saveClient(){
 var name=$("cName").value.trim();

 if(!name){
  alert("Ingresá el nombre del cliente.");
  return;
 }

 var id=$("clientId").value;
 var client;

 if(id){
  client=findClient(id);

  if(!client){
   alert("No se encontró el cliente.");
   return;
  }

  client.name=name;
  client.phone=$("cPhone").value.trim();
  client.address=$("cAddress").value.trim();
  client.notes=$("cNotes").value.trim();

 }else{
  client={
   id:uid(),
   name:name,
   phone:$("cPhone").value.trim(),
   address:$("cAddress").value.trim(),
   notes:$("cNotes").value.trim(),
   createdAt:Date.now()
  };

  db.clients.push(client);
 }

 persist();
 setupSelects();

 if(afterClientTarget){
  var target=afterClientTarget;
  afterClientTarget="";

  openScreen(target);

  if(target==="service"){
   $("sClient").value=client.id;
   updateContactFields("s");
  }

  if(target==="mdf"){
   $("mClient").value=client.id;
   updateContactFields("m");
  }

 }else{
  openScreen("clients");
 }

 alert("Cliente guardado correctamente.");
}

function deleteClient(){
 var id=$("clientId").value;

 if(!id)return;

 var c=findClient(id);
 if(!c)return;

 var used=false;

 for(var i=0;i<db.orders.length;i++){
  if(db.orders[i].clientId===id){
   used=true;
   break;
  }
 }

 var message=used
 ?"Este cliente tiene órdenes asociadas. ¿Querés eliminarlo igualmente?":"¿Eliminar este cliente?";

 if(!confirm(message))return;

 for(var j=db.clients.length-1;j>=0;j--){
  if(db.clients[j].id===id){
   db.clients.splice(j,1);
   break;
  }
 }

 persist();
 setupSelects();
 openScreen("clients");
 alert("Cliente eliminado.");
}

function newClientFromService(){
 afterClientTarget="service";
 newClient();
}

function newClientFromMdf(){
 afterClientTarget="mdf";
 newClient();
}

function renderClients(){
 var box=$("clientsList");
 if(!box)return;

 var q=($("clientSearch").value||"").toLowerCase().trim();

 box.innerHTML="";

 var found=0;

 for(var i=0;i<db.clients.length;i++){
  var c=db.clients[i];

  var text=(c.name+" "+(c.phone||"")+" "+(c.address||"")).toLowerCase();

  if(q && text.indexOf(q)<0)continue;

  found++;

  var div=document.createElement("div");
  div.className="card";

  div.innerHTML=
   "<b>"+esc(c.name)+"</b>"+
   "<br>📞 "+esc(c.phone||"Sin teléfono")+
   "<br>📍 "+esc(c.address||"Sin dirección")+
   (c.notes?"<br>📝 "+esc(c.notes):"")+
   "<div style='margin-top:8px'>"+
   "<button class='blue' onclick=\"editClient('"+c.id+"')\">✏️ Editar</button>"+
   "<button class='red' onclick=\"deleteClientDirect('"+c.id+"')\">🗑️ Eliminar</button>"+
   "</div>";

  box.appendChild(div);
 }

 if(!found){
  box.innerHTML="<div class='card'>No hay clientes.</div>";
 }
}

function deleteClientDirect(id){
 var c=findClient(id);
 if(!c)return;

 var used=false;

 for(var i=0;i<db.orders.length;i++){
  if(db.orders[i].clientId===id){
   used=true;
   break;
  }
 }

 var message=used
 ?"Este cliente tiene órdenes asociadas. ¿Eliminarlo igualmente?"
 :"¿Eliminar a "+c.name+"?";

 if(!confirm(message))return;

 for(var j=db.clients.length-1;j>=0;j--){
  if(db.clients[j].id===id){
   db.clients.splice(j,1);
   break;
  }
 }

 persist();
 setupSelects();
}

window.newClient=newClient;
window.editClient=editClient;
window.saveClient=saveClient;
window.deleteClient=deleteClient;
window.deleteClientDirect=deleteClientDirect;
window.newClientFromService=newClientFromService;
window.newClientFromMdf=newClientFromMdf;
window.renderClients=renderClients;
window.updateContactFields=updateContactFields;

/* IMPORTAR CONTACTO ANDROID */

function importContact(){
 var phoneInput=$("cPhone");

 /*
  Android/Chrome no permite que una página lea
  toda la agenda silenciosamente.
  Contact Picker permite elegir un contacto cuando
  el navegador lo soporta.
  */

 if(navigator.contacts && navigator.contacts.select){

  navigator.contacts.select(
   ["name","tel"],
   {multiple:false}
  ).then(function(contacts){

   if(!contacts || !contacts.length)return;

   var contact=contacts[0];

   if(contact.name && contact.name.length){
    $("cName").value=contact.name[0];
   }

   if(contact.tel && contact.tel.length){
    phoneInput.value=contact.tel[0];
   }

  }).catch(function(){
   alert("No se pudo abrir el selector de contactos.");
  });

 }else{
  alert(
   "Tu navegador no permite importar contactos directamente. "+
   "Probá abrir JUREMA con Google Chrome actualizado."
  );
 }
}

window.importContact=importContact;

/* SERVICIO TECNICO */

function resetService(){
 $("sOrderId").value="";
 $("serviceTitle").textContent="Servicio Técnico";
 $("sClient").value="";
 $("sPhone").value="";
 $("sAddress").value="";
 $("sBrand").value="";
 $("sModel").value="";
 $("sSerial").value="";
 $("sProblem").value="";
 $("sCondition").value="";
 $("sAccessories").value="";
 $("sStatus").value="Pendiente";
 $("sCost").value="";
 $("sPaid").value="";
 $("sBalance").textContent="0";
 $("sNotes").value="";
 currentPhotos=[];
 $("photosPreview").innerHTML="";
}

function calcService(){
 var total=Number($("sCost").value)||0;
 var paid=Number($("sPaid").value)||0;

 var balance=Math.max(0,total-paid);

 $("sBalance").textContent=money(balance);
}

function readPhotos(){
 var files=$("sPhotos").files;

 if(!files || !files.length)return;

 var pending=files.length;

 for(var i=0;i<files.length;i++){
  (function(file){

   var reader=new FileReader();

   reader.onload=function(e){
    currentPhotos.push(e.target.result);
    pending--;

    if(pending===0){
     renderPhotos();
    }
   };

   reader.readAsDataURL(file);

  })(files[i]);
 }
}

function renderPhotos(){
 var box=$("photosPreview");
 box.innerHTML="";

 for(var i=0;i<currentPhotos.length;i++){
  box.innerHTML+=
   "<img class='photo' src='"+currentPhotos[i]+"'>";
 }
}

function saveService(){
 var clientId=$("sClient").value;

 if(!clientId){
  alert("Seleccioná un cliente.");
  return;
 }

 var total=Number($("sCost").value)||0;
 var paid=Number($("sPaid").value)||0;
 var balance=Math.max(0,total-paid);

 var existingId=$("sOrderId").value;

 if(existingId){
  var o=findOrder(existingId);

  if(!o){
   alert("No se encontró la orden.");
   return;
  }

  o.type="service";
  o.clientId=clientId;
  o.phone=$("sPhone").value.trim();
  o.address=$("sAddress").value.trim();
  o.brand=$("sBrand").value.trim();
  o.model=$("sModel").value.trim();
  o.serial=$("sSerial").value.trim();
  o.problem=$("sProblem").value.trim();
  o.condition=$("sCondition").value.trim();
  o.accessories=$("sAccessories").value.trim();
  o.status=$("sStatus").value;
  o.total=total;
  o.paid=paid;
  o.balance=balance;
  o.paymentStatus=balance<=0?"paid":"pending";
  o.notes=$("sNotes").value.trim();
  o.photos=currentPhotos.slice();

  persist();
  showReceipt(o.id);
  return;
 }

 var order={
  id:uid(),
  number:nextNumber(),
  type:"service",
  clientId:clientId,
  date:today(),
  phone:$("sPhone").value.trim(),
  address:$("sAddress").value.trim(),
  brand:$("sBrand").value.trim(),
  model:$("sModel").value.trim(),
  serial:$("sSerial").value.trim(),
  problem:$("sProblem").value.trim(),
  condition:$("sCondition").value.trim(),

/* MDF */

function resetMdf(){
 $("mOrderId").value="";
 $("mdfTitle").textContent="Pedido MDF";
 $("mClient").value="";
 $("mPhone").value="";
 $("mAddress").value="";
 $("mPayment").value="pending";
 $("mPaid").value="";
 $("mBalance").value="";
 $("mNotes").value="";
 $("mdfItems").innerHTML="";
 addMdfItem();
}

function addMdfItem(data){
 var box=$("mdfItems");

 var div=document.createElement("div");
 div.className="item";

 var id=uid();

 div.setAttribute("data-item-id",id);

 div.innerHTML=
  "<label>Producto / descripción</label>"+
  "<input class='mdfDesc' value='"+esc(data?data.desc:"")+"' placeholder='Ej: Nombre personalizado'>"+
  "<div class='row'>"+
   "<div><label>Cantidad</label>"+
   "<input class='mdfQty' type='number' inputmode='decimal' value='"+(data?data.qty:1)+"' oninput='calcMdf()'></div>"+
   "<div><label>Precio unitario</label>"+
   "<input class='mdfPrice' type='number' inputmode='decimal' value='"+(data?data.price:"")+"' oninput='calcMdf()'></div>"+
  "</div>"+
  "<div>Subtotal: $<span class='mdfSubtotal'>0</span></div>"+
  "<button class='red' type='button' onclick='removeMdfItem(this)'>🗑️ Quitar</button>";

 box.appendChild(div);

 calcMdf();
}

function removeMdfItem(btn){
 var box=$("mdfItems");

 if(box.children.length<=1){
  alert("El pedido debe tener al menos un producto.");
  return;
 }

 btn.parentNode.remove();
 calcMdf();
}

function readMdfItems(){
 var box=$("mdfItems");
 var arr=[];

 for(var i=0;i<box.children.length;i++){
  var el=box.children[i];

  var desc=el.querySelector(".mdfDesc").value.trim();
  var qty=Number(el.querySelector(".mdfQty").value)||0;
  var price=Number(el.querySelector(".mdfPrice").value)||0;

  if(desc || price){
   arr.push({
    desc:desc,
    qty:qty,
    price:price,
    subtotal:qty*price
   });
  }
 }

 return arr;
}

function calcMdf(){
 var items=readMdfItems();
 var total=0;

 var els=$("mdfItems").children;

 for(var i=0;i<els.length;i++){
  var qty=Number(els[i].querySelector(".mdfQty").value)||0;
  var price=Number(els[i].querySelector(".mdfPrice").value)||0;
  var sub=qty*price;

  total+=sub;

  els[i].querySelector(".mdfSubtotal").textContent=money(sub);
 }

 $("mTotal").textContent=money(total);

 var paid;

 if($("mPayment").value==="paid"){
  paid=total;
  $("mPaid").value=total;
 }else{
  paid=Number($("mPaid").value)||0;
 }

 var balance=Math.max(0,total-paid);

 $("mBalance").value=money(balance);

 return {
  items:items,
  total:total,
  paid:paid,
  balance:balance
 };
}

function saveMdf(){
 var clientId=$("mClient").value;

 if(!clientId){
  alert("Seleccioná un cliente.");
  return;
 }

 var data=calcMdf();

 if(data.items.length===0){
  alert("Agregá al menos un producto.");
  return;
 }

 var existingId=$("mOrderId").value;

 if(existingId){
  var o=findOrder(existingId);

  if(!o){
   alert("No se encontró la orden.");
   return;
  }

  o.type="mdf";
  o.clientId=clientId;
  o.phone=$("mPhone").value.trim();
  o.address=$("mAddress").value.trim();
  o.items=data.items;
  o.total=data.total;
  o.paid=data.paid;
  o.balance=data.balance;
  o.paymentStatus=data.balance<=0?"paid":"pending";
  o.paymentMethod=$("mPayment").value;
  o.notes=$("mNotes").value.trim();

  persist();
  showReceipt(o.id);
  return;
 }

 var order={
  id:uid(),
  number:nextNumber(),
  type:"mdf",
  clientId:clientId,
  date:today(),
  phone:$("mPhone").value.trim(),
  address:$("mAddress").value.trim(),
  items:data.items,
  total:data.total,
  paid:data.paid,
  balance:data.balance,
  paymentStatus:data.balance<=0?"paid":"pending",
  paymentMethod:$("mPayment").value,
  status:data.balance<=0?"Entregado":"Pendiente",
  notes:$("mNotes").value.trim(),
  createdAt:Date.now()
 };

 db.orders.push(order);

 persist();

 showReceipt(order.id);
}

window.resetMdf=resetMdf;
window.addMdfItem=addMdfItem;
window.removeMdfItem=removeMdfItem;
window.calcMdf=calcMdf;
window.saveMdf=saveMdf;

function editOrder(id){
 var o=findOrder(id);
 if(!o)return;

 if(o.type==="service"){
  $("sOrderId").value=o.id;
  $("serviceTitle").textContent="Editar Servicio #"+o.number;

  $("sClient").value=o.clientId||"";
  $("sPhone").value=o.phone||"";
  $("sAddress").value=o.address||"";
  $("sBrand").value=o.brand||"";
  $("sModel").value=o.model||"";
  $("sSerial").value=o.serial||"";
  $("sProblem").value=o.problem||"";
  $("sCondition").value=o.condition||"";
  $("sAccessories").value=o.accessories||"";
  $("sStatus").value=o.status||"Pendiente";
  $("sCost").value=o.total||"";
  $("sPaid").value=o.paid||"";
  $("sNotes").value=o.notes||"";

  currentPhotos=(o.photos||[]).slice();
  renderPhotos();
  calcService();

  openScreen("service");
 }

 if(o.type==="mdf"){
  $("mOrderId").value=o.id;
  $("mdfTitle").textContent="Editar Pedido MDF #"+o.number;

  $("mClient").value=o.clientId||"";
  $("mPhone").value=o.phone||"";
  $("mAddress").value=o.address||"";
  $("mPayment").value=o.paymentMethod||"pending";
  $("mNotes").value=o.notes||"";

  $("mdfItems").innerHTML="";

  var items=o.items||[];

  if(items.length===0){
   addMdfItem();
  }else{
   for(var i=0;i<items.length;i++){
    addMdfItem(items[i]);
   }
  }

  if(o.paymentMethod==="paid"){
   $("mPayment").value="paid";
  }else{
   $("mPayment").value="pending";
   $("mPaid").value=o.paid||"";
  }

  calcMdf();
  openScreen("mdf");
 }
}

function deleteOrder(id){
 var o=findOrder(id);
 if(!o)return;

 if(!confirm(
  "¿Eliminar la orden #"+o.number+"?\n\n"+
  "Esta acción no se puede deshacer."
 ))return;

 for(var i=db.orders.length-1;i>=0;i--){
  if(db.orders[i].id===id){
   db.orders.splice(i,1);
   break;
  }
 }

 persist();

 alert("Orden eliminada.");
}

function renderOrders(){
 var box=$("ordersList");
 if(!box)return;

 var q=($("orderSearch").value||"").toLowerCase().trim();

 box.innerHTML="";

 var found=0;

 for(var i=db.orders.length-1;i>=0;i--){
  var o=db.orders[i];

  var name=clientName(o.clientId);
  var type=o.type==="mdf"?"MDF":"Servicio Técnico";

  var searchText=(
   o.number+" "+
   name+" "+
   type+" "+
   (o.brand||"")+" "+
   (o.model||"")+" "+
   (o.serial||"")
  ).toLowerCase();

  if(q && searchText.indexOf(q)<0)continue;

  var status=o.status||"Pendiente";

  if(orderFilter==="Pendientes"){
   if(status==="Entregado" || status==="Listo")continue;
  }

  if(orderFilter==="Terminadas"){
   if(status!=="Listo")continue;
  }

  if(orderFilter==="Entregadas"){
   if(status!=="Entregado")continue;
  }

  found++;

  var paymentClass=o.balance<=0?"paid":"pending";
  var paymentText=o.balance<=0?"Pagado":"Pendiente";

  var div=document.createElement("div");
  div.className="card";

  div.innerHTML=
   "<div style='display:flex;justify-content:space-between;align-items:center'>"+
    "<b>Orden #"+esc(o.number)+"</b>"+
    "<span class='status "+paymentClass+"'>"+paymentText+"</span>"+
   "</div>"+
   "<p><b>"+esc(type)+"</b></p>"+
   "<p>👤 "+esc(name)+"</p>"+
   "<p>📅 "+esc(o.date||"")+"</p>"+
   (o.brand||o.model?
    "<p>🖨️ "+esc((o.brand||"")+" "+(o.model||""))+"</p>":"")+
   "<p>Estado: <b>"+esc(status)+"</b></p>"+
   "<p>Total: <b>$"+money(o.total)+"</b></p>"+
   "<p>Cobrado: $"+money(o.paid)+"</p>"+
   "<p>Saldo: $"+money(o.balance)+"</p>"+
   "<div>"+
    "<button class='blue' onclick=\"editOrder('"+o.id+"')\">✏️ Editar</button>"+
    "<button class='green' onclick=\"showReceipt('"+o.id+"')\">🧾 Documento</button>"+
    "<button class='red' onclick=\"deleteOrder('"+o.id+"')\">🗑️ Eliminar</button>"+
   "</div>";

  box.appendChild(div);
 }

 if(!found){
  box.innerHTML="<div class='card'>No se encontraron órdenes.</div>";
 }
}

window.setOrderFilter=setOrderFilter;
window.editOrder=editOrder;
window.deleteOrder=deleteOrder;

function shareReceipt(){

========================= */

function exportBackup(){
 var data=JSON.stringify(db,null,2);

 var blob=new Blob(
  [data],
  {type:"application/json"}
 );

 var url=URL.createObjectURL(blob);

 var a=document.createElement("a");

 a.href=url;
 a.download="JUREMA_backup_"+new Date().toISOString().slice(0,10)+".json";

 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);

 setTimeout(function(){
  URL.revokeObjectURL(url);
 },1000);
}

function importBackup(event){
 var file=event.target.files[0];

 if(!file)return;

 var reader=new FileReader();

 reader.onload=function(e){

  try{

   var data=JSON.parse(e.target.result);

   if(!data || !Array.isArray(data.clients) || !Array.isArray(data.orders)){
    alert("El archivo no parece ser una copia de JUREMA.");
    return;
   }

   if(!confirm(
    "La importación reemplazará los datos actuales.\n\n"+
    "¿Continuar?"
   ))return;

   db=data;

   if(!db.next)db.next=5;

   persist();
   setupSelects();

   alert("Copia restaurada correctamente.");

  }catch(error){

   alert("No se pudo leer la copia de seguridad.");

  }

  event.target.value="";
 };

 reader.readAsText(file);
}

function renderBackupInfo(){
 var box=$("backupInfo");
 if(!box)return;

 box.innerHTML=
  "<div class='card'>"+
   "<b>Clientes:</b> "+db.clients.length+
   "<br><b>Órdenes:</b> "+db.orders.length+
  "</div>";
}

window.exportBackup=exportBackup;

window.renderBackupInfo=renderBackupInfo;
