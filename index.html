<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>JUREMA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0}
.back{background:#374151;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:20px}
main{max-width:700px;margin:auto;padding:16px}
.screen{display:none}
.screen.active{display:block}
h2{margin-top:4px}
.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:11px;padding:12px 14px;font-size:15px;cursor:pointer;background:#111827;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}
button.danger{background:#b91c1c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{width:100%;min-height:62px}
label{display:block;font-weight:bold;margin:11px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;background:#fff}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions button{flex:1}
.item{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:8px 0}
.small{font-size:13px;color:#6b7280}
.money{font-weight:bold;font-size:18px}
.status{display:inline-block;padding:5px 8px;border-radius:8px;background:#e5e7eb;font-size:12px}
.ok{background:#dcfce7;color:#166534}
.warn{background:#fef3c7;color:#92400e}
.total{font-size:22px;font-weight:bold}
.hidden{display:none}
.photo{width:85px;height:85px;object-fit:cover;border-radius:8px;margin:4px}
.photos{display:flex;flex-wrap:wrap}
@media(max-width:430px){
 .grid{grid-template-columns:1fr}
 main{padding:12px}
}
@media print{
 header,.no-print{display:none!important}
 body{background:#fff}
 .screen{display:none!important}
 .screen.printing{display:block!important}
 .card{box-shadow:none}
}
</style>
</head>

<body>

<header>
<button id="backBtn" class="back" onclick="goBack()" style="display:none">‹</button>
<h1>JUREMA</h1>
</header>

<main>

<!-- INICIO -->
<section id="home" class="screen active">

<div class="card">
<h2>JUREMA</h2>
<p>Servicio técnico y pedidos MDF</p>
</div>

<div class="grid menu">

<button onclick="openScreen('service')">
🔧 Servicio Técnico
</button>

<button onclick="openScreen('mdf')">
🪵 Pedido MDF
</button>

<button onclick="openScreen('clients')">
👥 Clientes
</button>

<button onclick="openScreen('orders')">
📋 Órdenes
</button>

<button onclick="openScreen('equipment')">
🖨️ Equipos
</button>

<button onclick="openScreen('cash')">
💰 Caja JUREMA
</button>

<button onclick="openScreen('backup')">
💾 Copia de Seguridad
</button>

</div>
</section>


<!-- CLIENTES -->
<section id="clients" class="screen">

<div class="card">

<div class="actions">
<button onclick="newClient()">+ Nuevo cliente</button>
<button class="secondary" onclick="openScreen('home',false)">Inicio</button>
</div>

<input
id="clientSearch"
placeholder="Buscar cliente..."
oninput="renderClients()">

</div>

<div id="clientsList"></div>

</section>


<!-- FORMULARIO CLIENTE -->
<section id="clientForm" class="screen">

<div class="card">

<h2 id="clientFormTitle">Nuevo cliente</h2>

<label>Nombre</label>
<input id="cName">

<label>Teléfono</label>
<input id="cPhone" type="tel">

<label>Dirección</label>
<input id="cAddress">

<label>Observaciones</label>
<textarea id="cNotes"></textarea>

<div class="actions">

<button onclick="saveClient()">
Guardar cliente
</button>

<button class="secondary" onclick="goBack()">
Cancelar
</button>

</div>

</div>

</section>


<!-- SERVICIO TECNICO -->
<section id="service" class="screen">

<div class="card">

<h2 id="serviceTitle">
Nuevo servicio técnico
</h2>

<label>Cliente</label>

<select id="sClient"></select>

<div class="actions">
<button class="secondary" onclick="newClientFromService()">
+ Crear cliente
</button>
</div>

<label>Teléfono</label>
<input id="sPhone">

<label>Dirección</label>
<input id="sAddress">

<label>Marca</label>
<input id="sBrand">

<label>Modelo</label>
<input id="sModel">

<label>Número de serie</label>
<input id="sSerial">

<label>Problema / falla</label>
<textarea id="sProblem"></textarea>

<label>Estado</label>

<select id="sStatus">
<option>Pendiente</option>
<option>Terminado</option>
<option>Entregado</option>
</select>

<label>Costo total</label>

<input
id="sTotal"
type="number"
min="0"
step="0.01"
oninput="calcService()">

<label>Seña / pago</label>

<input
id="sPaid"
type="number"
min="0"
step="0.01"
oninput="calcService()">

<div class="card">

<div>
Saldo:
<span id="sBalance" class="money">$0</span>
</div>

</div>

<label>Condición exterior</label>
<input id="sExterior">

<label>Accesorios</label>
<input id="sAccessories">

<label>Observaciones</label>
<textarea id="sNotes"></textarea>

<label>Fotos</label>

<input
id="sPhotos"
type="file"
accept="image/*"
multiple
onchange="readPhotos(event)">

<div id="servicePhotos" class="photos"></div>

<div class="actions">

<button onclick="saveService()">
Guardar servicio
</button>

<button class="secondary" onclick="goBack()">
Cancelar
</button>

</div>

</div>

</section>


<!-- PEDIDO MDF -->
<section id="mdf" class="screen">

<div class="card">

<h2 id="mdfTitle">
Nuevo pedido MDF
</h2>

<label>Cliente</label>

<select id="mClient"></select>

<div class="actions">

<button
class="secondary"
onclick="newClientFromMdf()">

+ Crear cliente

</button>

</div>

<div id="mdfItems"></div>

<button
class="secondary"
onclick="addMdfItem()">

+ Agregar producto

</button>

<label>Total</label>

<input
id="mTotal"
type="number"
readonly>


<label>Estado del pedido</label>

<select id="mStatus">

<option>Pendiente</option>
<option>Terminado</option>
<option>Entregado</option>

</select>


<label>Estado de pago</label>

<select
id="mPayment"
onchange="calcMdf()">

<option value="pending">
Pendiente
</option>

<option value="paid">
Pagado
</option>

</select>


<label>Pagado / seña</label>

<input
id="mPaid"
type="number"
min="0"
step="0.01"
oninput="calcMdf()">


<div class="card">

<div>
Saldo:
<span id="mBalance" class="money">$0</span>
</div>

<p class="small">
Si seleccionás “Pagado”, el pedido queda cobrado por el total y se suma a la facturación.
</p>

</div>


<label>Observaciones</label>

<textarea id="mNotes"></textarea>


<div class="actions">

<button onclick="saveMdf()">
Guardar pedido MDF
</button>

<button
class="secondary"
onclick="goBack()">

Cancelar

</button>

</div>

</div>

</section>


<!-- ORDENES -->
<section id="orders" class="screen">

<div class="card">

<input
id="orderSearch"
placeholder="Buscar por cliente, número o equipo..."
oninput="renderOrders()">

<label>Filtrar</label>

<select
id="orderFilter"
onchange="renderOrders()">

<option value="all">Todas</option>
<option>Pendiente</option>
<option>Terminado</option>
<option>Entregado</option>

</select>

</div>

<div id="ordersList"></div>

</section>


<!-- EQUIPOS -->
<section id="equipment" class="screen">

<div class="card">

<input
id="equipmentSearch"
placeholder="Buscar impresora/equipo..."
oninput="renderEquipment()">

</div>

<div id="equipmentList"></div>

</section>


<!-- CAJA -->
<section id="cash" class="screen">

<div id="cashSummary"></div>

<div id="cashList"></div>

</section>


<!-- COPIA -->
<section id="backup" class="screen">

<div class="card">

<h2>Copia de seguridad</h2>

<p>
Guardá una copia de todos los clientes y órdenes.
</p>

<div class="actions">

<button onclick="exportBackup()">
Exportar copia
</button>

<button
class="secondary"
onclick="document.getElementById('importFile').click()">

Importar copia

</button>

</div>

<input
id="importFile"
class="hidden"
type="file"
accept=".json,application/json"
onchange="importBackup(event)">

</div>

<div id="backupInfo"></div>

<div class="card">

<button
class="danger"
onclick="clearDatabase()">

Borrar todos los datos

</button>

</div>

</section>


<!-- RECIBO -->
<section id="receipt" class="screen">

<div id="receiptContent"></div>

<div class="actions no-print">

<button onclick="window.print()">
Imprimir
</button>

<button onclick="shareReceipt()">
Compartir
</button>

<button
class="secondary"
onclick="goBack()">

Volver

</button>

</div>

</section>

</main>


<script>

(function(){

"use strict";


/* =========================
   BASE DE DATOS
========================= */

var KEY = "jurema_v4";

var db = {
 clients: [],
 orders: [],
 next: 5
};

var currentScreen = "home";
var stack = [];
var editingClientId = null;
var editingOrderId = null;
var tempPhotos = [];
var afterClientTarget = null;


/* =========================
   FUNCIONES BÁSICAS
========================= */

function $(id){
 return document.getElementById(id);
}


function uid(){

 return "id_" +
 Date.now() +
 "_" +
 Math.random().toString(36).slice(2,10);

}


function money(n){

 return "$" +
 Number(n || 0).toLocaleString(
  "es-AR",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 );

}


function esc(s){

 return String(s == null ? "" : s)
 .replace(/[&<>"']/g,function(c){

  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];

 });

}


function today(){

 return new Date().toLocaleDateString("es-AR");

}


function findClient(id){

 return db.clients.find(function(c){
  return c.id === id;
 });

}


function findOrder(id){

 return db.orders.find(function(o){
  return o.id === id;
 });

}


function clientName(id){

 var c = findClient(id);

 return c ? c.name : "Sin cliente";

}


/* =========================
   GUARDADO
========================= */

function loadDatabase(){

 try{

  var raw = localStorage.getItem(KEY);

  if(raw){

   var x = JSON.parse(raw);

   if(
    x &&
    Array.isArray(x.clients) &&
    Array.isArray(x.orders)
   ){

    db = x;

    if(!db.next){
     db.next = 5;
    }

   }

  }

 }catch(e){

  alert(
   "No se pudo leer la memoria del teléfono. Se iniciará una base nueva."
  );

 }

}


function persist(){

 try{

  localStorage.setItem(
   KEY,
   JSON.stringify(db)
  );

  return true;

 }catch(e){

  alert(
   "No se pudieron guardar los datos en el teléfono. Revisá el espacio disponible del navegador."
  );

  return false;

 }

}


function nextNumber(){

 var n = Number(db.next) || 5;

 db.next = n + 5;

 return String(n).padStart(5,"0");

}


/* =========================
   PANTALLAS
========================= */

window.openScreen = function(name,push){

 if(push === undefined){
  push = true;
 }

 if(name === currentScreen){
  return;
 }

 if(push){
  stack.push(currentScreen);
 }

 document
 .querySelectorAll(".screen")
 .forEach(function(s){

  s.classList.remove(
   "active",
   "printing"
  );

 });

 var el = $(name);

 if(!el){
  return;
 }

 el.classList.add("active");

 currentScreen = name;

 $("backBtn").style.display =
 name === "home" ? "none" : "block";


 if(name === "clients"){
  renderClients();
 }

 if(name === "orders"){
  renderOrders();
 }

 if(name === "equipment"){
  renderEquipment();
 }

 if(name === "cash"){
  renderCash();
 }

 if(name === "backup"){
  renderBackupInfo();
 }

 if(name === "service" && !editingOrderId){
  resetService();
 }

 if(name === "mdf" && !editingOrderId){
  resetMdf();
 }

};


window.goBack = function(){

 if(currentScreen === "home"){
  return;
 }

 var prev =
 stack.length ?
 stack.pop() :
 "home";

 editingClientId = null;
 editingOrderId = null;

 openScreen(prev,false);

};


/* =========================
   CLIENTES
========================= */

function fillClientSelect(id){

 var sel = $(id);

 if(!sel){
  return;
 }

 var old = sel.value;

 sel.innerHTML =
 '<option value="">-- Seleccionar cliente --</option>' +

 db.clients.map(function(c){

  return (
   '<option value="' +
   esc(c.id) +
   '">' +
   esc(c.name) +
   '</option>'
  );

 }).join("");

 if(old && findClient(old)){
  sel.value = old;
 }

}


function updateContactFields(prefix){

 var selectId =
 prefix === "s" ?
 "sClient" :
 "mClient";

 var id = $(selectId).value;

 var c = findClient(id);

 if(!c){
  return;
 }

 if(prefix === "s"){

  $("sPhone").value = c.phone || "";
  $("sAddress").value = c.address || "";

 }else{

  /* MDF no tiene campos de teléfono/dirección visibles */

 }

}


function setupSelects(){

 $("sClient").addEventListener(
  "change",
  function(){
   updateContactFields("s");
  }
 );

 $("mClient").addEventListener(
  "change",
  function(){
   updateContactFields("m");
  }
 );

}


function newClient(){

 editingClientId = null;

 $("clientFormTitle").textContent =
 "Nuevo cliente";

 $("cName").value = "";
 $("cPhone").value = "";
 $("cAddress").value = "";
 $("cNotes").value = "";

 openScreen("clientForm");

}


function editClient(id){

 var c = findClient(id);

 if(!c){
  return;
 }

 editingClientId = id;

 $("clientFormTitle").textContent =
 "Editar cliente";

 $("cName").value = c.name || "";
 $("cPhone").value = c.phone || "";
 $("cAddress").value = c.address || "";
 $("cNotes").value = c.notes || "";

 openScreen("clientForm");

}


window.saveClient = function(){

 var name =
 $("cName").value.trim();

 if(!name){

  alert(
   "Ingresá el nombre del cliente."
  );

  return;

 }

 var id = editingClientId;

 var c =
 id ?
 findClient(id) :
 null;


 if(c){

  c.name =
   name;

  c.phone =
   $("cPhone").value.trim();

  c.address =
   $("cAddress").value.trim();

  c.notes =
   $("cNotes").value.trim();

 }else{

  id = uid();

  db.clients.push({

   id:id,

   name:name,

   phone:
    $("cPhone").value.trim(),

   address:
    $("cAddress").value.trim(),

   notes:
    $("cNotes").value.trim()

  });

 }


 if(!persist()){
  return;
 }


 fillClientSelect("sClient");
 fillClientSelect("mClient");


 var target =
 afterClientTarget;

 afterClientTarget = null;
 editingClientId = null;


 alert(
  "Cliente guardado correctamente."
 );


 if(target){

  openScreen(
   target,
   false
  );

  if(target === "service"){

   $("sClient").value = id;

   updateContactFields("s");

  }else{

   $("mClient").value = id;

  }

 }else{

  openScreen(
   "clients",
   false
  );

 }

};


function deleteClient(id){

 if(!confirm(
  "¿Eliminar este cliente?"
  )){
  return;
 }

 db.clients =
 db.clients.filter(function(c){
  return c.id !== id;
 });

 persist();

 renderClients();

}


window.newClientFromService =
 function(){

  afterClientTarget =
   "service";

  newClient();

 };


window.newClientFromMdf =
 function(){

  afterClientTarget =
   "mdf";

  newClient();

 };


function renderClients(){

 var q =
 ($("clientSearch").value || "")
 .toLowerCase();

 var arr =
 db.clients.filter(function(c){

  return (
   (c.name || "") +
   " " +
   (c.phone || "") +
   " " +
   (c.address || "")
  )
  .toLowerCase()
  .includes(q);

 });


 $("clientsList").innerHTML =
 arr.length ?

 arr.map(function(c){

  return (

   '<div class="card">' +

   '<b>' +
   esc(c.name) +
   '</b>' +

   '<div class="small">' +
   esc(c.phone || "Sin teléfono") +
   '</div>' +

   '<div>' +
   esc(c.address || "Sin dirección") +
   '</div>' +

   '<div class="actions">' +

   '<button onclick="editClient(\'' +
   c.id +
   '\')">Editar</button>' +

   '<button class="danger" onclick="deleteClient(\'' +
   c.id +
   '\')">Eliminar</button>' +

   '</div>' +

   '</div>'

  );

 }).join("")

 :

 '<div class="card">No hay clientes.</div>';

}


/* =========================
   SERVICIO TECNICO
========================= */

function resetService(){

 editingOrderId = null;

 tempPhotos = [];

 $("serviceTitle").textContent =
 "Nuevo servicio técnico";

 fillClientSelect("sClient");

 $("sPhone").value = "";
 $("sAddress").value = "";
 $("sBrand").value = "";
 $("sModel").value = "";
 $("sSerial").value = "";
 $("sProblem").value = "";

 $("sStatus").value =
 "Pendiente";

 $("sTotal").value = "";
 $("sPaid").value = "";

 $("sBalance").textContent =
 money(0);

 $("sExterior").value = "";
 $("sAccessories").value = "";
 $("sNotes").value = "";

 $("servicePhotos").innerHTML = "";

 $("sPhotos").value = "";

}


function calcService(){

 var total =
 Number($("sTotal").value) || 0;

 var paid =
 Number($("sPaid").value) || 0;

 $("sBalance").textContent =
 money(
  Math.max(
   0,
   total - paid
  )
 );

}


window.readPhotos = function(ev){

 tempPhotos = [];

 var files =
 Array.from(
  ev.target.files || []
 );

 var left =
 files.length;

 if(!left){

  $("servicePhotos").innerHTML =
   "";

  return;

 }


 files.forEach(function(file){

  var reader =
   new FileReader();

  reader.onload =
   function(){

    var img =
     new Image();

    img.onload =
     function(){

      var canvas =
       document.createElement(
        "canvas"
       );

      var max = 1000;

      var scale =
       Math.min(
        1,
        max /
        Math.max(
         img.width,
         img.height
        )
       );

      canvas.width =
       Math.round(
        img.width * scale
       );

      canvas.height =
       Math.round(
        img.height * scale
       );

      var ctx =
       canvas.getContext("2d");

      ctx.drawImage(
       img,
       0,
       0,
       canvas.width,
       canvas.height
      );

      tempPhotos.push(
       canvas.toDataURL(
        "image/jpeg",
        .75
       )
      );

      left--;

      if(left === 0){
       renderPhotos();
      }

     };

    img.src =
     reader.result;

   };

  reader.readAsDataURL(file);

 });

};


function renderPhotos(){

 $("servicePhotos").innerHTML =
 tempPhotos.map(function(p,i){

  return (

   '<span>' +

   '<img class="photo" src="' +
   p +
   '">' +

   '<button type="button" class="danger" onclick="removePhoto(' +
   i +
   ')">×</button>' +

   '</span>'

  );

 }).join("");

}


window.removePhoto =
 function(i){

  tempPhotos.splice(i,1);

  renderPhotos();

 };


window.saveService =
 function(){

  var client =
   $("sClient").value;

  if(!client){

   alert(
    "Seleccioná un cliente."
   );

   return;

  }


  var total =
   Number($("sTotal").value) || 0;

  var paid =
   Number($("sPaid").value) || 0;


  var o =
   editingOrderId ?
   findOrder(editingOrderId) :
   null;


  if(!o){

   o = {

    id:uid(),

    number:nextNumber(),

    type:"service",

    date:today(),

    clientId:client

   };

   db.orders.push(o);

  }


  o.clientId =
   client;

  o.brand =
   $("sBrand").value.trim();

  o.model =
   $("sModel").value.trim();

  o.serial =
   $("sSerial").value.trim();

  o.problem =
   $("sProblem").value.trim();

  o.status =
   $("sStatus").value;

  o.total =
   total;

  o.paid =
   Math.min(
    paid,
    total
   );

  o.balance =
   Math.max(
    0,
    total - o.paid
   );

  o.phone =
   $("sPhone").value.trim();

  o.address =
   $("sAddress").value.trim();

  o.exterior =
   $("sExterior").value.trim();

  o.accessories =
   $("sAccessories").value.trim();

  o.notes =
   $("sNotes").value.trim();

  o.photos =
   tempPhotos.slice();

  o.paymentStatus =
   o.balance <= 0 ?
   "paid" :
   "pending";


  if(!persist()){
   return;
  }


  alert(
   "Servicio guardado correctamente."
  );

  editingOrderId = null;

  showReceipt(o.id);

 };


/* =========================
   PEDIDOS MDF
========================= */

function resetMdf(){

 editingOrderId = null;

 $("mdfTitle").textContent =
 "Nuevo pedido MDF";

 fillClientSelect("mClient");

 $("mStatus").value =
 "Pendiente";

 $("mPayment").value =
 "pending";

 $("mPaid").value =
 "";

 $("mNotes").value =
 "";

 $("mdfItems").innerHTML =
 "";

 addMdfItem();

 calcMdf();

}


window.addMdfItem =
 function(data){

  var d =
   data ||
   {
    description:"",
    qty:1,
    price:0
   };


  var wrap =
   document.createElement(
    "div"
   );

  wrap.className =
   "item mdfItem";


  wrap.innerHTML =

   '<label>Producto</label>' +

   '<input class="miDesc" value="' +
   esc(d.description) +
   '">' +

   '<div class="row">' +

   '<div>' +

   '">' +

   '</div>' +

   '<div>' +

   '<input class="miPrice" type="number" min="0" step="0.01" value="' +
   Number(d.price || 0) +

   '</div>' +

   '</div>' +

   '<div>' +

   'Subtotal: ' +

   '<b class="miSub">$0</b>' +

   '</div>' +

   '<button type="button" class="danger" onclick="this.parentNode.remove();calcMdf()">' +

   'Quitar' +

   '</button>';


  $("mdfItems")
   .appendChild(wrap);


  wrap
  .querySelectorAll("input")
  .forEach(function(x){

   x.addEventListener(
    "input",

   );

  });

 };


function readMdfItems(){

 return Array
 .from(
  document.querySelectorAll(
   ".mdfItem"
  )
 )
 .map(function(el){

  var q =
   Number(
    el.querySelector(
     ".miQty"
    ).value
   ) || 0;

  var p =
   Number(
    el.querySelector(
     ".miPrice"
    ).value
   ) || 0;


  return {

   description:
    el.querySelector(
     ".miDesc"
    ).value.trim(),

   qty:q,

   price:p,

   subtotal:q*p

  };

 })
 .filter(function(x){

  return (
   x.description ||
   x.price
  );

 });

}


window.calcMdf =
 function(){

  var items =
   readMdfItems();

  var total =
   items.reduce(
    function(a,x){
     return a + x.subtotal;
    },
    0
   );


  var payment =
   $("mPayment").value;


  var paid;


  if(payment === "paid"){

   paid = total;

  }else{

   paid =
    Number(
     $("mPaid").value
    ) || 0;

   if(paid > total){
    paid = total;
   }

  }


  $("mTotal").value =
   total.toFixed(2);


  if(payment === "paid"){

   $("mPaid").value =
    total.toFixed(2);

  }


  $("mBalance").textContent =
   money(
    Math.max(
     0,
     total - paid
    )
   );


  document
  .querySelectorAll(".mdfItem")
  .forEach(function(el){

   var q =
    Number(
     el.querySelector(
      ".miQty"
     ).value
    ) || 0;

   var p =
    Number(
     el.querySelector(
      ".miPrice"
     ).value
    ) || 0;

   el.querySelector(
    ".miSub"
   ).textContent =
    money(q*p);

  });

 };


window.saveMdf =
 function(){

  var client =
   $("mClient").value;

  if(!client){

   alert(
    "Seleccioná un cliente."
   );

   return;

  }


  var items =
   readMdfItems();


  if(!items.length){

   alert(
    "Agregá al menos un producto."
   );

   return;

  }


  var total =
   items.reduce(
    function(a,x){
     return a + x.subtotal;
    },
    0
   );


  var paid;


  if(
   $("mPayment").value ===
   "paid"
  ){

   paid = total;

  }else{

   paid =
    Number(
     $("mPaid").value
    ) || 0;

   paid =
    Math.min(
     paid,
     total
    );

  }


  var o =
   editingOrderId ?
   findOrder(editingOrderId) :
   null;


  if(!o){

   o = {

    id:uid(),

    number:nextNumber(),

    type:"mdf",

    date:today(),

    clientId:client

   };

   db.orders.push(o);

  }


  o.clientId =
   client;

  o.items =
   items;

  o.total =
   total;

  o.paid =
   paid;

  o.balance =
   Math.max(
    0,
    total - paid
   );

  o.paymentStatus =
   o.balance <= 0 ?
   "paid" :
   "pending";

  o.status =
   $("mStatus").value;

  o.notes =
   $("mNotes").value.trim();


  if(!persist()){
   return;
  }


  alert(
   "Pedido MDF guardado correctamente."
  );

  editingOrderId = null;

  showReceipt(o.id);

 };

   o.clientId || "";

window.renderCash = function(){

  var total =
   Number(o.total) || 0;

  var paid =
   Number(o.paid) || 0;

  var balance =
   Number(o.balance);

   balance =
    Math.max(
     0,
     total - paid
    );

  facturacion += total;
  cobrado += paid;

========================= */

window.exportBackup = function(){

 try{

  var data =
   JSON.stringify(
    db,
    null,
    2
   );


  var blob =
   new Blob(
    [data],
    {
     type:
      "application/json"
    }
   );


  var url =
   URL.createObjectURL(blob);


  var a =
   document.createElement("a");


  a.href =
   url;


  a.download =
   "jurema-backup-" +
   new Date()
   .toISOString()
   .slice(0,10) +
   ".json";


  document.body
   .appendChild(a);


  a.click();


  document.body
   .removeChild(a);


  setTimeout(
   function(){
    URL.revokeObjectURL(url);
   },
   1000
  );


 }catch(e){

  alert(
   "No se pudo crear la copia de seguridad."
  );

 }

};


window.importBackup = function(ev){

 var file =
  ev.target.files[0];


 if(!file){
  return;
 }


 var reader =
  new FileReader();


 reader.onload =
  function(){

   try{

    var x =
     JSON.parse(
      reader.result
     );


    if(
     !x ||
     !Array.isArray(x.clients) ||
     !Array.isArray(x.orders)
    ){

     throw new Error(
      "Formato inválido"
     );

    }


    db = x;


    if(
     !db.next ||
     Number(db.next) < 5
    ){

     db.next = 5;

    }


    if(
     persist()
    ){

     alert(
      "Copia restaurada correctamente."
     );

     renderBackupInfo();
     fillClientSelect("sClient");
     fillClientSelect("mClient");

    }


   }catch(e){

    alert(
     "El archivo no es una copia válida de JUREMA."
    );

   }

  };


 reader.readAsText(file);

};
