function actualizarSelectClientes(id){

 var select=document.getElementById(id);

 if(!select)return;

 var valorActual=select.value;

 select.innerHTML=
  '<option value="">-- Nuevo cliente --</option>';

 datos.clientes.forEach(function(c){

  var op=document.createElement("option");

  op.value=c.id;

  op.textContent=
   (c.nombre || "")+
   " - "+
   (c.telefono || "");

  select.appendChild(op);

 });

 if(
  valorActual &&
  datos.clientes.some(function(c){
   return c.id===valorActual;
  })
 ){

  select.value=valorActual;

 }

}


function guardarCliente(nombre,telefono,domicilio){

 nombre=(nombre || "").trim();
 telefono=telefono || "";
 domicilio=domicilio || "";

 if(!nombre)return null;

 var existente=datos.clientes.find(function(c){

  return(
   (c.nombre || "").toLowerCase()===
   nombre.toLowerCase() &&
   (c.telefono || "")===telefono
  );

 });

 if(existente){

  existente.nombre=nombre;
  existente.telefono=telefono;
  existente.domicilio=domicilio;

  guardarDatos();

  return existente.id;

 }

 var cliente={
  id:Date.now().toString(),
  nombre:nombre,
  telefono:telefono,
  domicilio:domicilio
 };

 datos.clientes.push(cliente);

 guardarDatos();

 return cliente.id;

}

function leerArchivo(file){

 return new Promise(function(resolve,reject){

  var reader=new FileReader();

  reader.onload=function(e){
   resolve(e.target.result);
  };

  reader.onerror=function(){
   reject(new Error("No se pudo leer la foto"));
  };

  reader.readAsDataURL(file);

 });

}


async function cargarFotos(){

 }catch(error){

 }

}

function agregarProducto(item){

 if(!item)item=null;

 var id=
  item && item.id ?
  item.id :
  "item_"+Date.now()+"_"+Math.random();

 var producto={

  id:id,

  descripcion:
   item && item.descripcion ?
   item.descripcion :
   "",

  cantidad:
   item && item.cantidad ?
   Number(item.cantidad) :
   1,

  precio:
   item && item.precio ?
   Number(item.precio) :
   0,

  subtotal:
   item && item.subtotal ?
   Number(item.subtotal) :
   0

 };

 if(producto.cantidad<1){
  producto.cantidad=1;
 }

 if(producto.precio<0){
  producto.precio=0;
 }

 producto.subtotal=
  producto.cantidad*producto.precio;

 productosMDF.push(producto);

 renderProductosMDF();

}

function actualizarProducto(id,campo,valor){

 var p=productosMDF.find(function(x){
  return x.id===id;
 });

 if(!p)return;

 if(campo==="cantidad"){

  p.cantidad=Math.max(
   1,
   Number(valor || 1)
  );

 }

 if(campo==="precio"){

  p.precio=Math.max(
   0,
   Number(valor || 0)
  );

 }

 if(campo==="descripcion"){
  p.descripcion=valor;
 }

 p.subtotal=
  p.cantidad*p.precio;

 var subtotal=document.getElementById(
  "subtotal_"+id
 );

 if(subtotal){

  subtotal.textContent=
   dinero(p.subtotal);

 }

 calcularMDF();

}

 return{

  sena:sena,

 };

}

/* =========================
   CLIENTES
========================= */

function mostrarClientes(){

  var cont=document.getElementById("listaClientes");

  if(!cont) return;

  var busqueda=document.getElementById("buscarClientes").value.toLowerCase().trim();

  var clientes=datos.clientes.slice();

  clientes.sort(function(a,b){

    return String(a.nombre||"").localeCompare(
      String(b.nombre||"")
    );

  });

  var filtrados=[];
  var i;

  for(i=0;i<clientes.length;i++){

    var c=clientes[i];

    var texto=
      String(c.nombre||"")+" "+
      String(c.telefono||"")+" "+
      String(c.direccion||"");

    if(busqueda &&
       texto.toLowerCase().indexOf(busqueda)===-1){

      continue;
    }

    filtrados.push(c);
  }

  if(filtrados.length===0){

    cont.innerHTML=
      "<div class='vacio'>No hay clientes registrados.</div>";

    return;
  }

  var html="";

  for(i=0;i<filtrados.length;i++){

    var cliente=filtrados[i];

    html+="<div class='card'>";

    html+="<b>"+escapeHTML(cliente.nombre||"")+"</b>";

    if(cliente.telefono){

      html+="<div>📞 "+
        escapeHTML(cliente.telefono)+
        "</div>";
    }

    if(cliente.direccion){

      html+="<div>📍 "+
        escapeHTML(cliente.direccion)+
        "</div>";
    }

    html+="<div class='acciones'>";

    html+="<button onclick=\"editarCliente('"+
      cliente.id+
      "')\">✏️</button>";

    html+="<button class='danger' onclick=\"eliminarCliente('"+
      cliente.id+
      "')\">🗑️</button>";

    html+="</div>";

    html+="</div>";
  }

  cont.innerHTML=html;
}


/* =========================
   GUARDAR CLIENTE
========================= */

function guardarCliente(){

  var nombre=document.getElementById("nombreCliente").value.trim();
  var telefono=document.getElementById("telefonoCliente").value.trim();
  var direccion=document.getElementById("direccionCliente").value.trim();

  if(!nombre){

    alert("Ingresá el nombre del cliente.");

    return;
  }

  if(editandoCliente){

    var encontrado=null;
    var i;

    for(i=0;i<datos.clientes.length;i++){

      if(String(datos.clientes[i].id)===String(editandoCliente)){

        encontrado=datos.clientes[i];

        break;
      }
    }

    if(encontrado){

      encontrado.nombre=nombre;
      encontrado.telefono=telefono;
      encontrado.direccion=direccion;

      guardarDatos();

      alert("Cliente actualizado.");

    }

    editandoCliente=null;

  }else{

    datos.clientes.push({

      id:String(Date.now()),

      nombre:nombre,

      telefono:telefono,

      direccion:direccion

    });

    guardarDatos();

    alert("Cliente guardado.");

  }

  document.getElementById("nombreCliente").value="";
  document.getElementById("telefonoCliente").value="";
  document.getElementById("direccionCliente").value="";

  mostrarClientes();

  actualizarSelectClientes();
}


/* =========================
   EDITAR CLIENTE
========================= */

function editarCliente(id){

  var cliente=null;
  var i;

  for(i=0;i<datos.clientes.length;i++){

    if(String(datos.clientes[i].id)===String(id)){

      cliente=datos.clientes[i];

      break;
    }
  }

  if(!cliente) return;

  editandoCliente=cliente.id;

  document.getElementById("nombreCliente").value=
    cliente.nombre||"";

  document.getElementById("telefonoCliente").value=
    cliente.telefono||"";

  document.getElementById("direccionCliente").value=
    cliente.direccion||"";

  mostrar("clientes");

  window.scrollTo(0,0);
}


/* =========================
   ELIMINAR CLIENTE
========================= */

function eliminarCliente(id){

  var cliente=null;
  var i;

  for(i=0;i<datos.clientes.length;i++){

    if(String(datos.clientes[i].id)===String(id)){

      cliente=datos.clientes[i];

      break;
    }
  }

  if(!cliente) return;

  var confirmar=confirm(
    "¿Eliminar al cliente "+(cliente.nombre||"")+"?"
  );

  if(!confirmar) return;

  var nuevaLista=[];

  for(i=0;i<datos.clientes.length;i++){

    if(String(datos.clientes[i].id)!==String(id)){

      nuevaLista.push(datos.clientes[i]);

    }
  }

  datos.clientes=nuevaLista;

  guardarDatos();

  mostrarClientes();

  actualizarSelectClientes();
}

/* =========================
   COPIA DE SEGURIDAD
========================= */

function exportarBackup(){

  var copia={
    version:2,
    fecha:new Date().toISOString(),
    datos:datos
  };

  var texto=JSON.stringify(copia,null,2);

  var blob=new Blob(
    [texto],
    {type:"application/json"}
  );

  var url=URL.createObjectURL(blob);

  var enlace=document.createElement("a");

  enlace.href=url;

  enlace.download=
    "JUREMA_BACKUP_"+
    fechaArchivo()+
    ".json";

  document.body.appendChild(enlace);

  enlace.click();

  document.body.removeChild(enlace);

  setTimeout(function(){

    URL.revokeObjectURL(url);

  },1000);
}


function importarBackup(event){

  var archivo=event.target.files[0];

  if(!archivo) return;

  var lector=new FileReader();

  lector.onload=function(e){

    try{

      var copia=JSON.parse(e.target.result);

      var nuevosDatos=null;

      if(copia && copia.datos){

        nuevosDatos=copia.datos;

      }else if(copia && copia.ordenes){

        nuevosDatos=copia;

      }

      if(!nuevosDatos ||
         !Array.isArray(nuevosDatos.ordenes) ||
         !Array.isArray(nuevosDatos.clientes)){

        alert("El archivo no parece ser una copia de JUREMA.");

        return;
      }

      var confirmar=confirm(
        "La importación reemplazará los datos actuales de JUREMA. ¿Continuar?"
      );

      if(!confirmar) return;

      datos=nuevosDatos;

      if(!Array.isArray(datos.clientes)){
        datos.clientes=[];
      }

      if(!Array.isArray(datos.ordenes)){
        datos.ordenes=[];
      }

      guardarDatos();

      actualizarSelectClientes();

      mostrarOrdenes();

      mostrarClientes();

      mostrarEquipos();

      mostrarCaja();

      alert("Copia restaurada correctamente.");

    }catch(error){

      alert(
        "No se pudo leer la copia de seguridad."
      );

    }

  };

  lector.readAsText(archivo);

  event.target.value="";
}


function fechaArchivo(){

  var d=new Date();

  var y=d.getFullYear();

  var m=String(d.getMonth()+1);

  if(m.length<2) m="0"+m;

  var dia=String(d.getDate());

  if(dia.length<2) dia="0"+dia;

  return y+"-"+m+"-"+dia;
}


/* =========================
   COMPARTIR FOTOS
========================= */

function compartirFotos(id){

  var o=buscarOrden(id);

  if(!o){

    alert("No se encontró la orden.");

    return;
  }

  if(!o.fotos || o.fotos.length===0){

    alert("Esta orden no tiene fotos.");

    return;
  }

  if(!navigator.share){

    alert(
      "Tu navegador no permite compartir archivos directamente."
    );

    return;
  }

  var archivos=[];

  var pendientes=o.fotos.length;

  var terminadas=0;

  for(var i=0;i<o.fotos.length;i++){

    convertirFotoAArchivo(
      o.fotos[i],
      "foto_"+o.id+"_"+(i+1)+".jpg",
      function(archivo){

        if(archivo){

          archivos.push(archivo);

        }

        terminadas++;

        if(terminadas===pendientes){

          compartirArchivos(
            archivos,
            o
          );

        }

      }
    );
  }
}


function convertirFotoAArchivo(dataURL,nombre,callback){

  try{

    var partes=dataURL.split(",");

    var mime="image/jpeg";

    if(partes[0].indexOf("image/")!==-1){

      var encontrado=
        partes[0].match(/data:(image\/[^;]+)/);

      if(encontrado){
        mime=encontrado[1];
      }
    }

    var binario=atob(partes[1]);

    var longitud=binario.length;

    var bytes=new Uint8Array(longitud);

    var i;

    for(i=0;i<longitud;i++){

      bytes[i]=binario.charCodeAt(i);

    }

    var blob=new Blob(
      [bytes],
      {type:mime}
    );

    var archivo=new File(
      [blob],
      nombre,
      {type:mime}
    );

    callback(archivo);

  }catch(error){

    callback(null);

  }
}


function compartirArchivos(archivos,o){

  if(archivos.length===0){

    alert("No se pudieron preparar las fotos.");

    return;
  }

  var datosCompartir={
    title:"JUREMA - Orden "+o.id,
    text:
      "Cliente: "+(o.cliente||"")+
      "\nOrden: "+o.id
  };

  try{

    if(navigator.canShare &&
       navigator.canShare({files:archivos})){

      datosCompartir.files=archivos;

      navigator.share(datosCompartir)
        .catch(function(){});

    }else{

      navigator.share({
        title:datosCompartir.title,
        text:datosCompartir.text
      }).catch(function(){});

      alert(
        "Tu navegador no permite compartir las fotos como archivos."
      );
    }

  }catch(error){

    alert(
      "No se pudieron compartir las fotos."
    );

  }
}
